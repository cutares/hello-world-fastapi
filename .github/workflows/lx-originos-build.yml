name: LX OriginOS ARM64 build

on:
  push:
    branches: [lx-originos-build]

permissions:
  contents: read

concurrency:
  group: lx-originos-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out build harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out pinned official LX source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lyswhut/lx-music-mobile
          ref: fb8480728d875fa5e0da25eebd3a26bb71723aae
          path: source
          persist-credentials: false
      - name: Check out pinned player dependency source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lyswhut/react-native-track-player
          ref: bfe33933793460e7588d4d8f38eddf7910806f29
          path: track-player
          persist-credentials: false
      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source patches and verify pins
        run: bash lx-build/scripts/prepare-source.sh
      - name: Install dependencies from the lockfile
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          cd source
          npm ci --no-audit --no-fund
      - name: Patch native dependency
        run: bash lx-build/scripts/patch-dependency.sh
      - name: Focused checks
        run: |
          python3 lx-build/tests/branding.test.py
          node lx-build/tests/branding-logo.test.cjs
          node lx-build/tests/timing-identity.test.cjs
          node lx-build/tests/system-media.test.cjs
          node lx-build/tests/lyric-request-race.test.cjs
          node lx-build/tests/system-queue.test.cjs
          node lx-build/tests/system-selection.test.cjs
          node lx-build/tests/no-app-updates.test.cjs
          python3 lx-build/tests/browser-source-check.py
          python3 lx-build/tests/diagnostics-source-check.py
          python3 lx-build/tests/vivo-protocol-source-check.py
          python3 lx-build/tests/vivo-controls-source-check.py
          python3 lx-build/tests/vivo-timing-source-check.py
          python3 lx-build/tests/vivo-lyrics-replay-source-check.py
          python3 lx-build/tests/native-lyrics/run.py
          cd source
          npx --no-install eslint src/components/common/MusicLogo.tsx src/screens/Home/Vertical/DrawerNav.tsx src/screens/Home/Horizontal/Aside.tsx src/plugins/player/playList.ts src/plugins/player/systemMedia.ts src/plugins/player/systemQueue.ts src/plugins/player/index.ts src/plugins/player/service.ts src/plugins/player/utils.ts src/core/player/player.ts src/screens/Home/Views/Setting/settings/Version.tsx
      - name: Ensure Android SDK packages
        run: bash lx-build/scripts/prepare-sdk.sh
      - name: Build ARM64 release with public temporary test signer
        run: |
          cd source/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Verify and collect ARM64 APK
        run: bash lx-build/scripts/collect-apk.sh
      - name: Upload temporary-signed APK and checksum only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lx-originos-arm64-temp-signed
          path: apk-artifact/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
